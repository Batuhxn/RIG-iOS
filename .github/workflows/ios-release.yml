name: iOS release candidate (TestFlight)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unused App Store Connect build number for version 0.2
        required: true
        default: '1'
        type: string
      upload_to_testflight:
        description: Explicitly authorize upload after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: rig-testflight-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    steps:
      - uses: actions/checkout@v4
      - name: Require main and successful Gate A for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ios-validation.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" --jq '.workflow_runs[] | select(.head_branch == "main") | .head_sha' > "$RUNNER_TEMP/gate-a-shas.txt"
          grep -Fxq "$GITHUB_SHA" "$RUNNER_TEMP/gate-a-shas.txt"
      - name: Select supported release toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install xcodegen
          xcodegen --version
      - name: Host checks
        run: |
          set -euo pipefail
          python3 scripts/static_audit.py
          python3 scripts/test_release_support.py
          python3 scripts/test_device_test_support.py
          bash -n scripts/release_testflight.sh
          git diff --check
      - name: Archive, export and validate; upload only when enabled
        env:
          RC_BUILD_NUMBER: ${{ inputs.build_number }}
          RC_UPLOAD: ${{ inputs.upload_to_testflight }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash scripts/release_testflight.sh
      - name: Remove signing material after cancellation or failure
        if: always()
        run: bash scripts/release_testflight.sh --cleanup
      - name: Collect sanitized release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RIG-RC1-${{ github.sha }}-${{ inputs.build_number }}
          if-no-files-found: warn
          retention-days: 14
          path: build/rc1/artifact/
