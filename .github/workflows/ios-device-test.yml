name: iOS device test (Ad Hoc)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rig-device-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  device-test:
    runs-on: macos-26
    timeout-minutes: 45
    environment: device-test
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifact
        id: artifact
        run: echo "name=RIG-AdHoc-${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Select the release toolchain
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.3.app
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Host checks
        run: |
          set -euo pipefail
          python3 scripts/static_audit.py
          python3 scripts/test_device_test_support.py
          bash -n scripts/device_test.sh
          git diff --check
      - name: Archive, export and verify the Ad Hoc IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: bash scripts/device_test.sh
      - name: Remove signing material even after cancellation or failure
        if: always()
        run: bash scripts/device_test.sh --cleanup
      - name: Collect the verified IPA and sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/device-test/artifact/
          if-no-files-found: warn
          retention-days: 7
