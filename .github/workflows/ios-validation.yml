# RIG iOS — Gate A on a macOS runner.
#
# Gate A passed in run 34627340043: simulator build and 154 XCTest tests,
# zero failures. It remains manually dispatched.
#
# The trigger is deliberately manual only. GitHub-hosted macOS runners are
# metered at a higher multiplier than Linux runners and are NOT free beyond an
# account's included allowance, so nothing here starts on its own. To run it on
# every push instead, uncomment the `push:` block below and accept that cost.
#
# It builds and tests. It does not sign, deploy, upload the app, publish a
# release, touch the App Store, or use any secret.

name: iOS validation

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

permissions:
  contents: read

concurrency:
  group: ios-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-a:
    name: Gate A — build and unit tests
    # macos-15, not macos-14. The first run of this workflow landed on macos-14
    # with Xcode 15.4, and XcodeGen 2.46 writes projects in the Xcode 16 format
    # (objectVersion 77), which Xcode 15.4 refuses to open:
    #   "The project 'RIG' cannot be opened because it is in a future Xcode
    #    project file format (77)."
    # That is a toolchain mismatch, not a Swift problem. macos-15 carries
    # Xcode 16.x, which reads that format. The alternative repair — pinning
    # XcodeGen back to 2.43.0 so it emits an Xcode 15 format — is deliberately
    # not taken: it freezes the tooling instead of the project.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          # An explicit stable version, not the image default and not "latest".
          # 16.4 is the newest stable Xcode 16 on the macos-15 image; the
          # fallback keeps an image refresh from hard-breaking the pin, and
          # betas are never eligible because only Xcode_16*.app is considered.
          PREFERRED="/Applications/Xcode_16.4.app"
          if [ -d "$PREFERRED" ]; then
            SELECTED="$PREFERRED"
          else
            SELECTED="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "${SELECTED:-}" ] || [ ! -d "$SELECTED" ]; then
            echo "No stable Xcode 16.x on this runner. Installed:" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          sudo xcode-select --switch "$SELECTED/Contents/Developer"
          echo "Selected: $SELECTED"

      - name: Show the toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcode-select --print-path
          swift --version
          # Fail closed rather than discover the format mismatch at build time.
          XCODE_MAJOR="$(xcodebuild -version | sed -n 's/^Xcode \([0-9][0-9]*\).*/\1/p' | head -n 1)"
          echo "Xcode major version: ${XCODE_MAJOR:-unknown}"
          if [ -z "${XCODE_MAJOR:-}" ] || [ "$XCODE_MAJOR" -lt 16 ]; then
            echo "Xcode 16 or newer is required to open an objectVersion 77 project." >&2
            exit 1
          fi

      - name: Install and verify XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          # The resolved version is printed so a failing run can be reproduced
          # against the exact tool that produced it.
          xcodegen --version

      - name: Static audit
        run: python3 scripts/static_audit.py

      - name: Generate the project and check its format
        run: |
          set -euo pipefail
          xcodegen generate
          OBJECT_VERSION="$(sed -n 's/.*objectVersion = \([0-9][0-9]*\);.*/\1/p' \
            RIG.xcodeproj/project.pbxproj | head -n 1)"
          echo "Generated project objectVersion: ${OBJECT_VERSION:-unreadable}"
          if [ -z "${OBJECT_VERSION:-}" ]; then
            echo "Could not read objectVersion from the generated project." >&2
            exit 1
          fi
          # The decisive, cheap test: this is the command that reported the
          # "future Xcode project file format" error on the first run. If the
          # selected Xcode can list the project's targets, it can open it.
          xcodebuild -project RIG.xcodeproj -list

      - name: Gate A — generate, build, test
        # One script, the same one a developer runs locally. It fails closed,
        # so a non-zero exit here fails the job.
        run: bash scripts/validate_macos.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RIGTests-xcresult
          path: build/RIGTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
